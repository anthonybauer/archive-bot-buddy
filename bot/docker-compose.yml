services:
  bot:
    build: .
    container_name: telegram-video-archive
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - ./data:/data              # SQLite database (persistent)
      - ./downloads:/downloads    # temporary video files (auto-cleaned)
      - ./cookies:/cookies:ro     # optional cookies.txt for private content
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
